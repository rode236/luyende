<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------------------------------------------------------
   0. CẤU HÌNH GEMINI API KEY & LƯU TRỮ ĐỀ (TỐI ĐA 30 ĐỀ)
--------------------------------------------------------- */
const MAX_SAVED_EXAMS = 30;

async function callGemini(promptText, userApiKey) {
  const apiKey = userApiKey || localStorage.getItem("user_gemini_key");
  
  if (!apiKey || !apiKey.trim()) {
    throw new Error("Vui lòng nhập Gemini API Key của bạn!");
  }
  
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey.trim()}`;
  
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { responseMimeType: "application/json" }
    })
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error?.message || `Lỗi kết nối Gemini API (${res.status})`);
  }

  const data = await res.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const cleanJson = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
  return JSON.parse(cleanJson);
}

/* ---------------------------------------------------------
   1. DỮ LIỆU MẪU BAN ĐẦU
--------------------------------------------------------- */
const BASE_GROUPS = [
  {
    id: "g1",
    name: "Nhóm 1 · Hàm số",
    questions: [
      { id:"g1q1", content:"Cho hàm số $y = -x^3 + 3x^2 + 2$. Số điểm cực trị của hàm số là:", options:["0","1","2","3"], correctIndex:2, explanation:"Đạo hàm $y' = -3x^2+6x = -3x(x-2)$ có hai nghiệm phân biệt $x=0$ và $x=2$, đổi dấu 2 lần nên có 2 cực trị." },
      { id:"g1q2", content:"Cho hàm số $y = x^4 - 2x^2 + 1$. Hàm số nghịch biến trên khoảng nào?", options:["$(-\\infty;-1)$","$(-1;0)$","$(0;1)$","$(1;+\\infty)$"], correctIndex:0, explanation:"$y' = 4x(x-1)(x+1) < 0$ trên $(-\\infty;-1)$ nên hàm số nghịch biến." },
      { id:"g1q3", content:"Giá trị lớn nhất của hàm số $y = -x^2+4x-1$ trên $\\mathbb{R}$ là:", options:["3","-3","1","5"], correctIndex:0, explanation:"Đỉnh parabol $y_{max}=3$ tại $x=2$." }
    ]
  }
];
const EXAM_MINUTES = 45;

/* ---------------------------------------------------------
   2. TIỆN ÍCH
--------------------------------------------------------- */
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const LETTERS = ["A","B","C","D"];

function buildAttempt(groups, opts){
  const shuffleQuestionOrder = !opts || opts.shuffleQuestionOrder !== false;
  let n = 0;
  return groups.map(g => ({
    id: g.id,
    name: g.name,
    questions: (shuffleQuestionOrder ? shuffleArray(g.questions) : g.questions).map(q => {
      n++;
      const shuffledOpts = shuffleArray(q.options.map((text,idx)=>({text, isCorrect: idx===q.correctIndex})));
      const options = shuffledOpts.map((o,i)=>({ key: LETTERS[i], text:o.text, isCorrect:o.isCorrect }));
      const correctKey = options.find(o=>o.isCorrect).key;
      return { id:q.id, num:n, content:q.content, explanation:q.explanation, options, correctKey, difficulty:q.difficulty };
    })
  }));
}

function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderLatexMix(text){
  if(!text) return "";
  const parts = String(text).split(/(\$\$[^$]+\$\$|\$[^$]+\$)/g);
  return parts.map(part => {
    if(part.length>3 && part.startsWith("$$") && part.endsWith("$$")){
      try{ return window.katex.renderToString(part.slice(2,-2), {throwOnError:false, displayMode:true}); }
      catch(e){ return escapeHtml(part); }
    }
    if(part.length>1 && part.startsWith("$") && part.endsWith("$")){
      try{ return window.katex.renderToString(part.slice(1,-1), {throwOnError:false}); }
      catch(e){ return escapeHtml(part); }
    }
    return escapeHtml(part).replace(/\n/g,"<br/>");
  }).join("");
}
function MathText({ text, className }){
  const html = useMemo(()=>renderLatexMix(text), [text]);
  return <span className={className} dangerouslySetInnerHTML={{ __html: html }} />;
}
function formatClock(totalSeconds){
  const s = Math.max(0, totalSeconds);
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

/* ---------------------------------------------------------
   3. GEMINI AI: SINH ĐỀ HÀM
--------------------------------------------------------- */
const DIFFICULTY_BANDS = [
  { from:1, to:4, count:4, levelName:"Nhận biết - Thông hiểu", guidance:"Rất dễ, công thức trực tiếp, số liệu đẹp." },
  { from:5, to:8, count:4, levelName:"Vận dụng thấp", guidance:"Độ khó trung bình, cần 2-3 bước biến đổi." },
  { from:9, to:11, count:3, levelName:"Vận dụng cao", guidance:"Khó, có bẫy hoặc tính toán phức tạp." },
  { from:12, to:12, count:1, levelName:"Phân hóa", guidance:"Câu hỏi chốt chặn, đòi hỏi tư duy sâu." }
];

async function generateQuestionBank(sourceText, apiKey, onProgress){
  let all = [];
  for(const band of DIFFICULTY_BANDS){
    if(onProgress) onProgress(band);
    const prompt = `Bạn là giáo viên Toán THPT. Câu hỏi gốc: "${sourceText}". Tạo đúng ${band.count} câu hỏi trắc nghiệm mới thuộc mức "${band.levelName}". Trả về MẢNG JSON gồm ${band.count} phần tử: [{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]`;
    const parsed = await callGemini(prompt, apiKey);
    const qs = parsed.map((item, i) => ({
      id: "q-" + Date.now() + "-" + band.from + "-" + i,
      content: item.question,
      options: item.options,
      correctIndex: item.correctIndex,
      explanation: item.explanation || "",
      difficulty: band.from + i
    }));
    all = all.concat(qs);
  }
  return all;
}

/* ---------------------------------------------------------
   4. MÀN HÌNH SẢNH CHÍNH (LƯU TRỮ ĐỀ & PHÒNG THI)
--------------------------------------------------------- */
function HomeScreen({ examList, onSelectExam, onOpenGenerator }){

            <p className="text-sm text-[#4B5675] mt-1">Chọn đề thi có sẵn hoặc tạo bộ đề mới bằng Gemini AI</p>
          </div>

          </button>

        <div className="bg-white rounded-2xl border border-[#E4E1D8] p-6">

            </h2>
            <span className="text-xs text-[#9AA5B1]">Tự động xóa đề cũ nếu vượt quá 30 đề</span>
          </div>

          <div className="grid gap-3">
            {examList.map((item, idx) => (
              <div key={item.id} className="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl border border-[#E4E1D8] hover:border-[var(--ink)] bg-[#FAF9F5] transition-all gap-3">
                <div>
                  <div className="flex items-center gap-2 mb-1">

/* ---------------------------------------------------------
   5. MÀN HÌNH TẠO ĐỀ GEMINI AI
--------------------------------------------------------- */
function GeneratorScreen({ onBack, onGenerated, apiKey, setApiKey }){
  const [sourceText, setSourceText] = useState("");
  const [examTitle, setExamTitle] = useState("");
  const [loading, setLoading] = useState(false);
  const [progressLabel, setProgressLabel] = useState("");
  const [error, setError] = useState("");

  async function handleGenerate(){
    if(!apiKey || !apiKey.trim()){ setError("Vui lòng nhập Gemini API Key!"); return; }
    if(!sourceText.trim()){ setError("Vui lòng dán câu hỏi gốc!"); return; }
    setError("");
    setLoading(true);
    localStorage.setItem("user_gemini_key", apiKey.trim());

    try{
      const questions = await generateQuestionBank(sourceText.trim(), apiKey.trim(), band => {
        setProgressLabel(`Gemini đang tạo câu ${band.from}${band.from!==band.to ? "-"+band.to : ""}/12…`);
      });
      
      const title = examTitle.trim() || `Bộ đề AI - ${sourceText.trim().slice(0, 25)}...`;
      onGenerated(title, questions);
    }catch(e){
      setError("Lỗi tạo câu hỏi: " + e.message);
    }
    setLoading(false);
    setProgressLabel("");
  }

  return (
    <div className="min-h-screen p-4 sm:p-8 max-w-3xl mx-auto">
      <button onClick={onBack} className="text-sm text-[#4B5675] hover:text-[var(--ink)] mb-4">← Quay lại Sảnh chính</button>
      <div className="bg-white rounded-2xl border border-[#E4E1D8] p-6 space-y-4">
        <h2 className="font-display font-bold text-xl text-[var(--ink)]">Tạo bộ đề 12 câu bằng AI</h2>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">1. Tên đề thi (Tùy chọn)</label>
          <input type="text" value={examTitle} onChange={e=>setExamTitle(e.target.value)}
            placeholder="Nhập tên đề thi (ví dụ: Đề Ôn Tập Chương 1)..."
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
        </div>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">2. Google Gemini API Key</label>
          <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
            placeholder="Dán AIzaSy... (Lấy miễn phí tại aistudio.google.com)"
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
        </div>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">3. Câu hỏi gốc để AI phát triển</label>
          <textarea value={sourceText} onChange={e=>setSourceText(e.target.value)} rows={4}
            placeholder="Dán câu hỏi mẫu vào đây..."
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
        </div>

        {error && <p className="text-sm text-[var(--danger)] font-semibold">{error}</p>}

        <button onClick={handleGenerate} disabled={loading}
          className="w-full py-3.5 rounded-xl bg-[var(--accent)] text-[var(--ink)] font-semibold hover:bg-[var(--accent-deep)] hover:text-white transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
          {loading ? <><span className="spinner !w-4 !h-4 !border-2"></span> {progressLabel}</> : "✨ Tạo đề và Lưu vào Sảnh"}
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   6. MÀN HÌNH LÀM BÀI THI
--------------------------------------------------------- */
function ExamScreen({ examTitle, groups, answers, onSelect, secondsLeft, onSubmit }){
  const allQuestions = groups.flatMap(g=>g.questions);

  return (

          <div>
            <h1 className="font-display font-bold text-[var(--ink)] text-base sm:text-lg">{examTitle}</h1>
            <p className="text-xs text-[#9AA5B1]">Đang thi trực tuyến</p>
          </div>
          <div className="font-mono-num text-2xl font-bold text-[var(--ink)]">
            {formatClock(secondsLeft)}
          </div>
        </div>
      </header>

      <div className="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-6 p-4 lg:p-8">
        <main>
          {groups.map(g => (
            <div key={g.id} className="mb-6">
              {g.questions.map(q => (
                <div key={q.id} id={"q-"+q.id} className="bg-white rounded-2xl border border-[#E4E1D8] p-5 mb-4 scroll-mt-24">

--------------------------------------------------------- */

    <div className="min-h-screen p-4 sm:p-8 max-w-3xl mx-auto">

        <button onClick={onGoHome}

/* ---------------------------------------------------------
   8. PHẦN CỐT LÕI ứng dụng (APP)
--------------------------------------------------------- */
function App(){
  // Khởi tạo danh sách đề thi từ localStorage hoặc mẫu có sẵn
  const [examList, setExamList] = useState(() => {
    const saved = localStorage.getItem("saved_exams");
    if(saved) {
      try { return JSON.parse(saved); } catch(e){}
    }
    return [{
      id: "exam-base-1",
      title: "Bộ đề Toán Cực Trị & Hàm Số Mẫu",
      createdAt: new Date().toLocaleDateString("vi-VN"),
      groups: BASE_GROUPS
    }];
  });

  const [currentExam, setCurrentExam] = useState(null);
  const [activeGroups, setActiveGroups] = useState([]);
  const [answers, setAnswers] = useState({});
  const [screen, setScreen] = useState("home"); // home, generator, exam, result
  const [secondsLeft, setSecondsLeft] = useState(EXAM_MINUTES*60);
  const [result, setResult] = useState(null);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("user_gemini_key") || "");

  // Lưu danh sách đề thi vào bộ nhớ máy
  useEffect(() => {
    localStorage.setItem("saved_exams", JSON.stringify(examList));
  }, [examList]);

  // Đồng hồ đếm ngược
  useEffect(() => {
    if(screen !== "exam") return;
    if(secondsLeft <= 0){ handleSubmit(); return; }
    const t = setTimeout(()=>setSecondsLeft(s=>s-1), 1000);
    return () => clearTimeout(t);
  }, [secondsLeft, screen]);

  function handleSelectExam(exam){
    setCurrentExam(exam);
    setActiveGroups(buildAttempt(exam.groups));
    setAnswers({});
    setResult(null);
    setSecondsLeft(EXAM_MINUTES*60);
    setScreen("exam");
  }

  function handleGeneratedNewExam(title, questions){
    const newExam = {
      id: "exam-" + Date.now(),
      title: title,
      createdAt: new Date().toLocaleDateString("vi-VN"),
      groups: [{ id: "g-ai-" + Date.now(), name: "Nhóm câu hỏi AI", questions }]
    };

    // Thêm đề mới và tự động xóa đề cũ nếu vượt quá 30 đề
    setExamList(prevList => {
      const updated = [newExam, ...prevList];
      if (updated.length > MAX_SAVED_EXAMS) {
        return updated.slice(0, MAX_SAVED_EXAMS); // Giữ lại đúng 30 đề mới nhất
      }
      return updated;
    });

    setScreen("home");
  }

  function handleSelectOption(qid, key){
    setAnswers(prev => ({ ...prev, [qid]: key }));
  }

  function handleSubmit(){
    const allQuestions = activeGroups.flatMap(g=>g.questions);
    const correctCount = allQuestions.filter(q => answers[q.id] === q.correctKey).length;
    const total = allQuestions.length;
    const score = total ? (correctCount/total)*10 : 0;
    
    setResult({ score, correctCount, total });
    setScreen("result");
  }

  return (
    <div style={{ background:"var(--paper)" }}>
      {screen === "home" && (
        <HomeScreen examList={examList} onSelectExam={handleSelectExam} onOpenGenerator={()=>setScreen("generator")} />
      )}
      {screen === "generator" && (
        <GeneratorScreen onBack={()=>setScreen("home")} onGenerated={handleGeneratedNewExam} apiKey={apiKey} setApiKey={setApiKey} />
      )}
      {screen === "exam" && currentExam && (
        <ExamScreen examTitle={currentExam.title} groups={activeGroups} answers={answers} onSelect={handleSelectOption} secondsLeft={secondsLeft} onSubmit={handleSubmit} />
      )}
      {screen === "result" && currentExam && (
        <ResultScreen examTitle={currentExam.title} groups={activeGroups} answers={answers} result={result} onGoHome={()=>setScreen("home")} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
