<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuyệnThi.AI — Phòng Thi Thông Minh ĐGNL, ĐGTD & THPT QG</title>
  
  <!-- Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  <style>
    :root {
      --paper: #FAF9F5;
      --ink: #14213D;
      --ink-soft: #4B5675;
      --line: #E4E1D8;
      --accent: #FCA311;
      --accent-hover: #E08E00;
    }
    body { background: var(--paper); font-family: 'Inter', sans-serif; color: var(--ink); }
    .font-display { font-family: 'Sora', sans-serif; }
    .font-mono-num { font-family: 'IBM Plex Mono', monospace; }
    
    .option-btn:hover { border-color: var(--accent); }
    .option-btn.selected { background: #F1EEE5; border-color: var(--ink) !important; }
    .option-btn.selected .bubble { background: var(--ink); color: #fff; border-color: var(--ink); }
    
    .bubble {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px; color: var(--ink-soft); flex-shrink: 0;
    }

    .badge-dgnl { background-color: #1e3a8a; color: #ffffff; }
    .badge-dgtd { background-color: #581c87; color: #ffffff; }
    .badge-thpt { background-color: #065f46; color: #ffffff; }

    .tag-easy { background-color: #dcfce7; color: #166534; }
    .tag-medium { background-color: #e0f2fe; color: #075985; }
    .tag-hard { background-color: #fef3c7; color: #92400e; }
    .tag-vhard { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="min-h-screen">

  <div id="app" class="max-w-4xl mx-auto p-4 sm:p-6"></div>

  <script>
    // --- 1. DỮ LIỆU ĐỀ THI MẪU ---
    const defaultExams = [
      {
        id: "exam-dgnl-sample",
        title: "Đề Thi Tư Duy Định Lượng & Logic Mẫu",
        examType: "ĐGNL (ĐHQG)",
        difficulty: "Hỗn hợp chuẩn đề thi thật",
        duration: 50,
        createdAt: "2026-08-26",
        questions: [
          {
            id: "q1",
            content: "Cho hàm số $y = -x^3 + 3x^2 + 2$. Số điểm cực trị của hàm số là:",
            options: ["0", "1", "2", "3"],
            correctIndex: 2,
            difficulty: "Thông hiểu",
            explanation: "Đạo hàm $y' = -3x^2 + 6x = 0$ có 2 nghiệm phân biệt $x=0, x=2$ nên hàm số có 2 điểm cực trị."
          },
          {
            id: "q2",
            content: "Cho tập hợp $A = \\{x \\in \\mathbb{R} \\mid x^2 - 4x + 3 = 0\\}$. Tổng các phần tử của $A$ bằng:",
            options: ["3", "4", "1", "7"],
            correctIndex: 1,
            difficulty: "Nhận biết",
            explanation: "Phương trình $x^2 - 4x + 3 = 0$ có 2 nghiệm $x_1 = 1, x_2 = 3$. Tổng $1 + 3 = 4$."
          },
          {
            id: "q3",
            content: "Giá trị lớn nhất của hàm số $y = -x^2 + 4x - 1$ trên $\\mathbb{R}$ là:",
            options: ["3", "-3", "1", "5"],
            correctIndex: 0,
            difficulty: "Vận dụng",
            explanation: "Tung độ đỉnh Parabol $y_{max} = 3$ tại $x = 2$."
          }
        ]
      }
    ];

    // --- 2. TRẠNG THÁI ỨNG DỤNG ---
    let state = {
      screen: 'home', // 'home', 'generator', 'exam', 'result'
      exams: loadSavedExams(),
      apiKey: localStorage.getItem('user_gemini_key') || '',
      currentExam: null,
      userAnswers: {},
      timeLeft: 0,
      timerId: null,
      loading: false,
      errorMsg: '',
      shuffledQuestions: []
    };

    function loadSavedExams() {
      try {
        const data = localStorage.getItem('saved_exams_v3');
        if (!data) return defaultExams;
        const parsed = JSON.parse(data);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : defaultExams;
      } catch (e) {
        return defaultExams;
      }
    }

    function saveExams(list) {
      state.exams = list;
      localStorage.setItem('saved_exams_v3', JSON.stringify(list));
    }

    function renderMath(text) {
      if (!text) return '';
      return text.replace(/\$([^$]+)\$/g, (match, math) => {
        try {
          return katex.renderToString(math, { throwOnError: false });
        } catch (e) {
          return math;
        }
      });
    }

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getExamTypeClass(type) {
      if (type.includes('ĐGNL')) return 'badge-dgnl';
      if (type.includes('ĐGTD')) return 'badge-dgtd';
      return 'badge-thpt';
    }

    function getDifficultyClass(diff) {
      if (diff.includes('Nhận biết')) return 'tag-easy';
      if (diff.includes('Thông hiểu')) return 'tag-medium';
      if (diff.includes('Vận dụng cao')) return 'tag-vhard';
      return 'tag-hard';
    }

    // --- 3. MÀN HÌNH CHÍNH (SẢNH THI) ---
    function renderHome() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h1 class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight">LuyệnThi.AI</h1>
            <p class="text-sm text-gray-600 mt-1">Phòng thi thông minh phân hóa chuẩn ĐGNL, ĐGTD & THPT Quốc Gia</p>
          </div>
          <button onclick="goGenerator()" class="px-5 py-3 rounded-xl bg-[var(--accent)] text-[var(--ink)] font-bold text-sm shadow-sm hover:bg-[var(--accent-hover)] transition flex items-center gap-2">
            ✨ Tạo đề thi chuẩn AI
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-[var(--line)] p-6 shadow-sm">
          <div class="flex items-center justify-between mb-5">
            <h2 class="font-display font-bold text-lg">Kho đề thi hiện có (${state.exams.length})</h2>
            <button onclick="resetDefaultExams()" class="text-xs text-gray-400 hover:text-red-500 underline transition">
              Khôi phục đề mẫu
            </button>
          </div>

          <div class="space-y-3">
            ${state.exams.map((exam, idx) => `
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl border border-[var(--line)] bg-[#FAF9F5] gap-3">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded ${getExamTypeClass(exam.examType || '')}">
                      ${exam.examType || 'THPT QG'}
                    </span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-amber-100 text-amber-900">
                      🎯 ${exam.difficulty || 'Phân hóa'}
                    </span>
                    <span class="text-xs text-gray-500">
                      ⏱️ ${exam.duration || 45} phút • 📝 ${exam.questions ? exam.questions.length : 0} câu
                    </span>
                  </div>
                  <h3 class="font-semibold text-base text-gray-900">${exam.title}</h3>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                  <button onclick="startExam('${exam.id}')" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl bg-[var(--ink)] text-white font-semibold text-sm hover:opacity-90 transition">
                    Vào thi →
                  </button>
                  <button onclick="deleteExam('${exam.id}')" class="px-3 py-2.5 rounded-xl border border-red-200 text-red-500 hover:bg-red-50 text-sm transition">
                    🗑️
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- 4. MÀN HÌNH TẠO ĐỀ AI ---
    function renderGenerator() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <button onclick="goHome()" class="text-sm text-gray-500 mb-4 inline-block hover:underline">← Quay lại Sảnh chính</button>
        <div class="bg-white rounded-2xl border border-[var(--line)] p-6 space-y-5 shadow-sm max-w-2xl mx-auto">
          <div>
            <h2 class="font-display font-bold text-xl">Soạn đề thi phân hóa bằng Gemini AI</h2>
            <p class="text-xs text-gray-500 mt-1">Hệ thống sẽ tự động phân tích và tạo bộ câu hỏi có ma trận độ khó chuẩn cấu trúc kỳ thi.</p>
          </div>
          
          ${state.errorMsg ? `<div class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm font-medium">${state.errorMsg}</div>` : ''}

          <div>
            <label class="text-xs font-bold text-gray-600 uppercase block mb-1">1. Tên bài thi / Chủ đề</label>
            <input id="examTitle" type="text" placeholder="Nhập tên bài thi..." class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none" value="Đề Luyện Thi AI — ${new Date().toLocaleDateString('vi-VN')}">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-bold text-gray-600 uppercase block mb-1">2. Chọn Kỳ thi định hướng</label>
              <select id="examTypeSelect" class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none">
                <option value="ĐGNL (ĐHQG)">ĐGNL — Đánh giá Năng lực (ĐHQG)</option>
                <option value="ĐGTD (ĐH Bách Khoa)">ĐGTD — Đánh giá Tư duy (ĐH Bách Khoa)</option>
                <option value="THPT Quốc Gia">THPT Quốc Gia (Bộ GD&ĐT)</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-bold text-gray-600 uppercase block mb-1">3. Mức độ phân hóa câu hỏi</label>
              <select id="difficultySelect" class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none">
                <option value="Cơ bản (Nhận biết - Thông hiểu)">Cơ bản (Nhận biết - Thông hiểu)</option>
                <option value="Phân hóa cao (Vận dụng & Vận dụng cao)">Phân hóa cao (Vận dụng & VD Cao)</option>
                <option value="Hỗn hợp chuẩn đề thi thật">Hỗn hợp đầy đủ 4 mức độ</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-bold text-gray-600 uppercase block mb-1">4. Thời gian làm bài (Phút)</label>
              <input id="examDuration" type="number" value="50" min="5" max="180" class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none">
            </div>
            <div>
              <label class="text-xs font-bold text-gray-600 uppercase block mb-1">5. Gemini API Key</label>
              <input id="apiKeyInput" type="password" placeholder="Dán API Key từ Google AI Studio..." class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none" value="${state.apiKey}">
            </div>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-600 uppercase block mb-1">6. Nội dung kiến thức / Tài liệu thô</label>
            <textarea id="sourceContent" rows="5" placeholder="Dán văn bản, bài học hoặc ghi chú dạng bài vào đây để Gemini tự biên soạn..." class="w-full text-sm p-3 rounded-xl border border-[var(--line)] bg-[#FAF9F5] focus:bg-white focus:outline-none"></textarea>
          </div>

          <button onclick="generateExamWithAI()" ${state.loading ? 'disabled' : ''} class="w-full py-4 rounded-xl bg-[var(--accent)] font-bold text-base hover:bg-[var(--accent-hover)] transition shadow-sm">
            ${state.loading ? '⏳ Gemini đang biên soạn đề thi...' : '✨ Tạo Đề Chuẩn Cấu Trúc Ngay'}
          </button>
        </div>
      `;
    }

    // --- 5. MÀN HÌNH LÀM BÀI THI ---
    function renderExam() {
      const app = document.getElementById('app');
      const exam = state.currentExam;
      const minutes = Math.floor(state.timeLeft / 60);
      const seconds = state.timeLeft % 60;
      const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      app.innerHTML = `
        <div class="sticky top-0 bg-[#FAF9F5] py-4 border-b border-[var(--line)] flex items-center justify-between mb-6 z-10">
          <div>
            <button onclick="goHome()" class="text-xs text-gray-500 hover:underline">← Thoát bài thi</button>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded ${getExamTypeClass(exam.examType)}">${exam.examType}</span>
              <h2 class="font-display font-bold text-base text-gray-900">${exam.title}</h2>
            </div>
          </div>
          <div class="font-mono-num text-2xl font-bold bg-white px-4 py-1.5 rounded-xl border border-[var(--line)] shadow-sm">
            ⏳ ${timeStr}
          </div>
        </div>

        <div class="space-y-6">
          ${state.shuffledQuestions.map((q, idx) => `
            <div class="bg-white rounded-2xl border border-[var(--line)] p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold text-gray-400">CÂU ${idx + 1}</span>
                <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded ${getDifficultyClass(q.difficulty || '')}">
                  ${q.difficulty || 'Mức độ Phân hóa'}
                </span>
              </div>
              <div class="text-base font-medium mb-4 text-gray-900">${renderMath(q.content)}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${q.options.map((opt, optIdx) => {
                  const letter = ['A', 'B', 'C', 'D'][optIdx];
                  const isSelected = state.userAnswers[q.id] === optIdx;
                  return `
                    <button onclick="selectAnswer('${q.id}', ${optIdx})" 
                      class="option-btn flex items-center gap-3 text-left p-3 rounded-xl border border-[var(--line)] transition ${isSelected ? 'selected' : 'bg-white'}">
                      <span class="bubble">${letter}</span>
                      <span class="text-sm">${renderMath(opt)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>

        <div class="mt-8 mb-12">
          <button onclick="submitExam()" class="w-full py-4 rounded-xl bg-[var(--ink)] text-white font-bold text-lg shadow-md hover:opacity-95 transition">
            Nộp Bài Thi
          </button>
        </div>
      `;
    }

    // --- 6. MÀN HÌNH KẾT QUẢ & LỜI GIẢI ---
    function renderResult() {
      const app = document.getElementById('app');
      const exam = state.currentExam;
      let correct = 0;
      
      state.shuffledQuestions.forEach(q => {
        if (state.userAnswers[q.id] === q.correctIndex) correct++;
      });
      
      const total = state.shuffledQuestions.length;
      const score = total > 0 ? ((correct / total) * 10).toFixed(1) : "0.0";

      app.innerHTML = `
        <div class="bg-white rounded-2xl border border-[var(--line)] p-6 sm:p-8 text-center max-w-xl mx-auto mt-6 shadow-sm">
          <span class="text-xs font-bold px-2.5 py-1 rounded ${getExamTypeClass(exam.examType)}">${exam.examType}</span>
          <h1 class="font-display font-bold text-xl mt-2 mb-1">${exam.title}</h1>
          <p class="text-xs text-gray-500 mb-6">Kết quả đánh giá năng lực cá nhân</p>
          
          <div class="text-6xl font-extrabold text-[var(--ink)] mb-2 font-display">${score}</div>
          <p class="text-sm text-gray-600 mb-6">Đúng ${correct} / ${total} câu</p>

          <div class="text-left space-y-4 mb-8">
            <h3 class="font-bold text-sm text-gray-700 uppercase border-b pb-2">Chi tiết đáp án & Phân tích lời giải:</h3>
            ${state.shuffledQuestions.map((q, idx) => {
              const userAns = state.userAnswers[q.id];
              const isCorrect = userAns === q.correctIndex;
              return `
                <div class="p-4 rounded-xl border ${isCorrect ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'} text-xs space-y-1">
                  <div class="flex justify-between font-semibold text-gray-800">
                    <span>Câu ${idx + 1}: ${isCorrect ? '✅ Đúng' : '❌ Sai'}</span>
                    <span class="px-2 py-0.5 rounded bg-white border border-gray-200 text-gray-700">${q.difficulty}</span>
                  </div>
                  <p class="text-gray-700">Đáp án chọn: <b>${userAns !== undefined ? ['A','B','C','D'][userAns] : 'Chưa chọn'}</b> | Đáp án đúng: <b>${['A','B','C','D'][q.correctIndex]}</b></p>
                  <p class="text-gray-600 mt-2"><i>💡 Lời giải chi tiết:</i> ${renderMath(q.explanation)}</p>
                </div>
              `;
            }).join('')}
          </div>

          <button onclick="goHome()" class="w-full py-3.5 rounded-xl bg-[var(--ink)] text-white font-bold transition hover:opacity-90">
            🏠 Quay lại Sảnh chính
          </button>
        </div>
      `;
    }

    // --- 7. TẠO ĐỀ VỚI GEMINI AI ---
    async function generateExamWithAI() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const content = document.getElementById('sourceContent').value.trim();
      const examType = document.getElementById('examTypeSelect').value;
      const difficulty = document.getElementById('difficultySelect').value;
      const duration = parseInt(document.getElementById('examDuration').value) || 50;
      const title = document.getElementById('examTitle').value.trim() || `Đề ${examType}`;

      if (!key) { state.errorMsg = 'Vui lòng nhập Gemini API Key!'; renderGenerator(); return; }
      if (!content) { state.errorMsg = 'Vui lòng nhập nội dung tài liệu!'; renderGenerator(); return; }

      state.loading = true;
      state.errorMsg = '';
      localStorage.setItem('user_gemini_key', key);
      state.apiKey = key;
      renderGenerator();

      const prompt = `Bạn là chuyên gia khảo thí ra đề thi. Hãy biên soạn 5 câu hỏi trắc nghiệm chuẩn cấu trúc kỳ thi "${examType}" với mức độ phân hóa "${difficulty}" dựa trên nội dung sau: "${content}".
      
      YÊU CẦU TRẢ VỀ:
      Chỉ trả về duy nhất 1 mảng JSON thuần túy theo mẫu:
      [
        {
          "content": "Nội dung câu hỏi (sử dụng $công_thức_toán$ nếu có)",
          "options": ["Lựa chọn A", "Lựa chọn B", "Lựa chọn C", "Lựa chọn D"],
          "correctIndex": 0,
          "difficulty": "Nhận biết / Thông hiểu / Vận dụng / Vận dụng cao",
          "explanation": "Lời giải chi tiết câu hỏi..."
        }
      ]`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || 'Lỗi từ API Gemini');

        const rawJson = data.candidates[0].content.parts[0].text;
        const questions = JSON.parse(rawJson).map((q, i) => ({ ...q, id: 'ai-q-' + Date.now() + '-' + i }));

        const newExam = {
          id: 'exam-' + Date.now(),
          title,
          examType,
          difficulty,
          duration,
          createdAt: new Date().toISOString().split('T')[0],
          questions
        };

        saveExams([newExam, ...state.exams]);
        state.loading = false;
        goHome();
      } catch (e) {
        state.loading = false;
        state.errorMsg = 'Lỗi tạo đề: ' + e.message;
        renderGenerator();
      }
    }

    // --- 8. HÀM ĐIỀU HƯỚNG & XỬ LÝ ---
    function goHome() {
      if (state.timerId) clearInterval(state.timerId);
      state.screen = 'home';
      renderHome();
    }

    function goGenerator() {
      state.screen = 'generator';
      state.errorMsg = '';
      renderGenerator();
    }

    function startExam(examId) {
      state.currentExam = state.exams.find(e => e.id === examId);
      if (!state.currentExam) return;

      // Xáo trộn thứ tự câu hỏi khi bấm vào thi
      state.shuffledQuestions = shuffleArray(state.currentExam.questions);
      state.userAnswers = {};
      state.timeLeft = (state.currentExam.duration || 50) * 60;
      state.screen = 'exam';
      
      if (state.timerId) clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 0) {
          clearInterval(state.timerId);
          submitExam();
        } else {
          renderExam();
        }
      }, 1000);

      renderExam();
    }

    function selectAnswer(questionId, optionIndex) {
      state.userAnswers[questionId] = optionIndex;
      renderExam();
    }

    function submitExam() {
      if (state.timerId) clearInterval(state.timerId);
      state.screen = 'result';
      renderResult();
    }

    function deleteExam(examId) {
      if (confirm('Bạn có chắc muốn xóa bài thi này khỏi kho?')) {
        const list = state.exams.filter(e => e.id !== examId);
        saveExams(list);
        renderHome();
      }
    }

    function resetDefaultExams() {
      saveExams(defaultExams);
      renderHome();
    }

    // Khởi chạy ứng dụng
    renderHome();
  </script>
</body>
</html>
