<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const MAX_SAVED_EXAMS = 30;

function cleanAndParseJSON(rawText) {
  let clean = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
  clean = clean.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
  clean = clean.replace(/\\(?!["\\/bfnrtu])/g, "\\\\");

  try {
    return JSON.parse(clean);
  } catch (err) {
    const start = clean.indexOf("[");
    const end = clean.lastIndexOf("]");
    if (start !== -1 && end !== -1 && end > start) {
      const extracted = clean.substring(start, end + 1);
      return JSON.parse(extracted);
    }
    throw err;
  }
}

async function requestGemini(modelName, promptText, apiKey) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey.trim();
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { responseMimeType: "application/json" }
    })
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    const message = errData.error?.message || ('Lỗi kết nối Gemini API (' + res.status + ')');
    const error = new Error(message);
    error.status = res.status;
    throw error;
  }

  const data = await res.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  return cleanAndParseJSON(rawText);
}

async function callGemini(promptText, userApiKey) {
  const apiKey = userApiKey || localStorage.getItem("user_gemini_key");
  if (!apiKey || !apiKey.trim()) {
    throw new Error("Vui lòng nhập Gemini API Key của bạn!");
  }

  try {
    return await requestGemini("gemini-1.5-flash", promptText, apiKey);
  } catch (err) {
    if (err.status === 429 || err.status === 503 || (err.message && err.message.includes("high demand"))) {
      return await requestGemini("gemini-1.5-pro", promptText, apiKey);
    }
    throw err;
  }
}

const BASE_GROUPS = [
  {
    id: "g1",
    name: "Nhóm 1 · Hàm số & Tư duy",
    questions: [
      { id:"g1q1", content:"Cho hàm số $y = -x^3 + 3x^2 + 2$. Số điểm cực trị của hàm số là:", options:["0","1","2","3"], correctIndex:2, explanation:"Đạo hàm $y' = -3x^2+6x = -3x(x-2)$ có hai nghiệm phân biệt $x=0$ và $x=2$, đổi dấu 2 lần nên có 2 cực trị." },
      { id:"g1q2", content:"Cho hàm số $y = x^4 - 2x^2 + 1$. Hàm số nghịch biến trên khoảng nào?", options:["$(-\\infty;-1)$","$(-1;0)$","$(0;1)$","$(1;+\\infty)$"], correctIndex:0, explanation:"$y' = 4x(x-1)(x+1) < 0$ trên $(-\\infty;-1)$ nên hàm số nghịch biến." },
      { id:"g1q3", content:"Giá trị lớn nhất của hàm số $y = -x^2+4x-1$ trên $\\mathbb{R}$ là:", options:["3","-3","1","5"], correctIndex:0, explanation:"Đỉnh parabol $y_{max}=3$ tại $x=2$." }
    ]
  }
];

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const LETTERS = ["A","B","C","D"];

function buildAttempt(groups, opts){
  const shuffleQuestionOrder = !opts || opts.shuffleQuestionOrder !== false;
  let n = 0;
  return groups.map(g => ({
    id: g.id,
    name: g.name,
    questions: (shuffleQuestionOrder ? shuffleArray(g.questions) : g.questions).map(q => {
      n++;
      const shuffledOpts = shuffleArray(q.options.map((text,idx)=>({text, isCorrect: idx===q.correctIndex})));
      const options = shuffledOpts.map((o,i)=>({ key: LETTERS[i], text:o.text, isCorrect:o.isCorrect }));
      return { id:q.id, num:n, content:q.content, explanation:q.explanation, options, correctKey: options.find(o=>o.isCorrect).key, difficulty:q.difficulty };
    })
  }));
}

function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderLatexMix(text){
  if(!text) return "";
  const parts = String(text).split(/(\$\$[^$]+\$\$|\$[^$]+\$)/g);
  return parts.map(part => {
    if(part.length>3 && part.startsWith("$$") && part.endsWith("$$")){
      try{ return window.katex.renderToString(part.slice(2,-2), {throwOnError:false, displayMode:true}); }
      catch(e){ return escapeHtml(part); }
    }
    if(part.length>1 && part.startsWith("$") && part.endsWith("$")){
      try{ return window.katex.renderToString(part.slice(1,-1), {throwOnError:false}); }
      catch(e){ return escapeHtml(part); }
    }
    return escapeHtml(part).replace(/\n/g,"<br/>");
  }).join("");
}
function MathText({ text, className }){
  const html = useMemo(()=>renderLatexMix(text), [text]);
  return <span className={className} dangerouslySetInnerHTML={{ __html: html }} />;
}
function formatClock(totalSeconds){
  const s = Math.max(0, totalSeconds);
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

const DIFFICULTY_BANDS = [
  { from:1, to:4, count:4, levelName:"Nhận biết - Thông hiểu", guidance:"Rất rõ ràng, kiểm tra trực tiếp kiến thức cốt lõi." },
  { from:5, to:8, count:4, levelName:"Vận dụng thấp", guidance:"Độ khó trung bình, cần 2-3 bước tư duy logic." },
  { from:9, to:11, count:3, levelName:"Vận dụng cao", guidance:"Phân hóa khá, đòi hỏi sự linh hoạt và tính toán cẩn thận." },
  { from:12, to:12, count:1, levelName:"Phân hóa xuất sắc", guidance:"Câu hỏi chốt chặn năng lực sâu sắc." }
];

async function generateQuestionBank(sourceText, standard, apiKey, onProgress){
  let all = [];
  for(const band of DIFFICULTY_BANDS){
    if(onProgress) onProgress(band);
    const prompt = 'Bạn là chuyên gia khảo thí uy tín. Định hướng / Chuẩn đề thi: "' + standard + '". Dựa vào nguồn/kiến thức trọng tâm sau: "' + sourceText + '". Hãy tạo đúng ' + band.count + ' câu hỏi trắc nghiệm mới bám sát định hướng ở mức độ "' + band.levelName + '" (' + band.guidance + '). Tránh câu hỏi đánh đố phi thực tế. Trả về MẢNG JSON duy nhất gồm ' + band.count + ' phần tử dạng: [{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]';

    const parsed = await callGemini(prompt, apiKey);
    const qs = parsed.map((item, i) => ({
      id: "q-" + Date.now() + "-" + band.from + "-" + i,
      content: item.question,
      options: item.options,
      correctIndex: item.correctIndex,
      explanation: item.explanation || "Không có giải thích chi tiết.",
      difficulty: band.from + i
    }));
    all = all.concat(qs);
  }
  return all;
}

                <div>
                  <div className="flex items-center gap-2 mb-1">

                </div>

                </button>
              </div>
            ))}
          </div>
        </div>

}

function GeneratorScreen({ onBack, onGenerated, apiKey, setApiKey, initialSourceText, initialTitle, initialStandard, initialDuration }){
  const [sourceText, setSourceText] = useState(initialSourceText || "");
  const [examTitle, setExamTitle] = useState(initialTitle || "");
  const [standard, setStandard] = useState(initialStandard || "Kỳ thi tốt nghiệp THPT Quốc gia");
  const [durationMinutes, setDurationMinutes] = useState(initialDuration || 45);
  const [loading, setLoading] = useState(false);
  const [progressLabel, setProgressLabel] = useState("");
  const [error, setError] = useState("");

  async function handleGenerate(){
    if(!apiKey || !apiKey.trim()){ setError("Vui lòng nhập Gemini API Key!"); return; }
    if(!sourceText.trim()){ setError("Vui lòng nhập nội dung hoặc câu hỏi gốc!"); return; }
    if(!durationMinutes || durationMinutes <= 0){ setError("Thời gian làm bài phải lớn hơn 0 phút!"); return; }
    setError("");
    setLoading(true);
    localStorage.setItem("user_gemini_key", apiKey.trim());

    try{
      const questions = await generateQuestionBank(sourceText.trim(), standard, apiKey.trim(), band => {
        setProgressLabel("Gemini đang tạo câu " + band.from + (band.from!==band.to ? "-" + band.to : "") + "/12...");
      });
      
      const title = examTitle.trim() || ("Đề ôn tập (" + standard + ") - " + sourceText.trim().slice(0, 20) + "...");
      onGenerated(title, questions, standard, Number(durationMinutes));
    }catch(e){
      setError("Lỗi tạo câu hỏi: " + e.message);
    }
    setLoading(false);
    setProgressLabel("");
  }

  return (
    <div className="min-h-screen p-4 sm:p-8 max-w-3xl mx-auto">
      <button onClick={onBack} className="text-sm text-[#4B5675] hover:text-[var(--ink)] mb-4">← Quay lại Sảnh chính</button>
      <div className="bg-white rounded-2xl border border-[#E4E1D8] p-6 space-y-4">
        <h2 className="font-display font-bold text-xl text-[var(--ink)]">Tạo bộ đề 12 câu thông minh bằng AI</h2>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">1. Chuẩn độ khung định hướng cho AI (Quan trọng)</label>
          <select value={standard} onChange={e=>setStandard(e.target.value)}
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] bg-white focus:outline-none focus:border-[var(--accent)] font-medium">
            <option value="Kỳ thi tốt nghiệp THPT Quốc gia">Chuẩn THPT Quốc gia (Bám sát cấu trúc đề Bộ GD&ĐT)</option>
            <option value="Đánh giá năng lực ĐHQG TP.HCM (VNU-HCM)">Đánh giá năng lực ĐHQG TP.HCM (Logic, Tư duy, Giải quyết vấn đề)</option>
            <option value="Đánh giá năng lực ĐHQG Hà Nội (VNU-Hanoi)">Đánh giá năng lực ĐHQG Hà Nội (Tư duy định lượng & Khoa học)</option>
            <option value="Đánh giá tư duy ĐH Bách Khoa Hà Nội (TSA)">Đánh giá tư duy Đại học Bách Khoa Hà Nội (TSA)</option>
            <option value="Kiểm tra đánh giá chất lượng cơ bản">Ôn tập kiến thức cơ bản / Luyện tập hàng ngày</option>
          </select>
          <p className="text-xs text-[#9AA5B1] mt-1">AI sẽ điều chỉnh độ khó phù hợp với định hướng này, tránh câu hỏi quá khó hoặc xa rời trọng tâm.</p>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div className="sm:col-span-2">
            <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">2. Tên đề thi (Tùy chọn)</label>
            <input type="text" value={examTitle} onChange={e=>setExamTitle(e.target.value)}
              placeholder="Ví dụ: Ôn tập các câu làm sai / Đề kiểm tra..."
              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
          </div>
          <div>
            <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">⏱️ Thời gian thi (Phút)</label>
            <input type="number" min="1" max="180" value={durationMinutes} onChange={e=>setDurationMinutes(e.target.value)}
              placeholder="45"
              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)] font-semibold" />
          </div>
        </div>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">3. Google Gemini API Key</label>
          <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
            placeholder="Dán AIzaSy... (Lấy miễn phí tại aistudio.google.com)"
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
        </div>

        <div>
          <label className="text-sm font-semibold text-[var(--ink)] mb-1 block">4. Nội dung / Câu hỏi gốc để AI phát triển</label>
          <textarea value={sourceText} onChange={e=>setSourceText(e.target.value)} rows={5}
            placeholder="Dán nội dung, chuyên đề hoặc các câu hỏi cần ôn tập vào đây..."
            className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-[#E4E1D8] focus:outline-none focus:border-[var(--accent)]" />
        </div>

        {error && <p className="text-sm text-[var(--danger)] font-semibold break-words">{error}</p>}

          {loading ? <><span className="spinner !w-4 !h-4 !border-2"></span> {progressLabel}</> : "✨ Tạo đề và Lưu vào Sảnh"}
        </button>
      </div>
    </div>
  );
}

function ResultScreen({ examTitle, groups, answers, result, onGoHome, onRetryMistakes }){
  const allQuestions = groups.flatMap(g=>g.questions);
  const wrongQuestions = allQuestions.filter(q => answers[q.id] !== q.correctKey);

  return (
    <div className="min-h-screen p-4 sm:p-8 max-w-4xl mx-auto">
      <div className="bg-white rounded-2xl border border-[#E4E1D8] p-6 mb-6">
        <div className="text-center mb-6">
          <h1 className="font-display font-bold text-xl text-[var(--ink)] mb-1">{examTitle}</h1>
          <p className="text-xs text-[#9AA5B1] mb-4">Kết quả thi & Hướng dẫn giải chi tiết</p>

          <div className="font-display text-5xl font-extrabold text-[var(--ink)] mb-2">
            {result.score.toFixed(2)} <span className="text-xl font-normal text-[#9AA5B1]">/ 10đ</span>
          </div>

          <div className="flex justify-center gap-6 text-sm mb-6">
            <div><span className="font-semibold text-[var(--success)]">{result.correctCount}</span> câu đúng</div>
            <div><span className="font-semibold text-[var(--danger)]">{result.total - result.correctCount}</span> câu sai</div>
          </div>

          <div className="flex flex-col sm:flex-row gap-3">
            <button onClick={onGoHome}
              className="flex-1 py-3.5 rounded-xl bg-[var(--ink)] text-white font-bold hover:bg-[#243357] transition-colors">
              🏠 Quay lại Sảnh chính
            </button>
            {wrongQuestions.length > 0 && (
              <button onClick={() => onRetryMistakes(wrongQuestions)}
                className="flex-1 py-3.5 rounded-xl bg-[var(--accent)] text-[var(--ink)] font-bold hover:bg-[var(--accent-deep)] hover:text-white transition-colors shadow-sm">
                ✨ Tạo đề ôn tập các câu làm sai ({wrongQuestions.length} câu)
              </button>
            )}
          </div>
        </div>

        <hr className="border-[#E4E1D8] my-6" />

        <h3 className="font-display font-bold text-lg text-[var(--ink)] mb-4">Chi tiết từng câu & Cách giải</h3>
        <div className="space-y-4">
          {allQuestions.map(q => {
            const userAns = answers[q.id];
            const isCorrect = userAns === q.correctKey;
            return (
              <div key={q.id} className={"rounded-xl border p-4 " + (isCorrect ? "border-[#A7F3D0] bg-[#F0FDF4]" : "border-[#FECACA] bg-[#FEF2F2]")}>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-[#4B5675]">Câu {q.num}</span>
                  <span className={"text-xs font-bold px-2 py-0.5 rounded " + (isCorrect ? "bg-[var(--success-bg)] text-[var(--success)]" : "bg-[var(--danger-bg)] text-[var(--danger)]")}>
                    {isCorrect ? "Đúng ✓" : "Sai ✗"}
                  </span>
                </div>
                <MathText text={q.content} className="text-sm font-semibold text-[var(--ink)] block mb-3" />
                
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
                  {q.options.map(opt => {
                    let badgeStyle = "bg-white border-[#E4E1D8] text-[var(--ink-soft)]";
                    if (opt.key === q.correctKey) badgeStyle = "bg-[var(--success)] text-white font-bold border-[var(--success)]";
                    else if (opt.key === userAns && !isCorrect) badgeStyle = "bg-[var(--danger)] text-white font-bold border-[var(--danger)]";

                    return (
                      <div key={opt.key} className={"text-xs p-2 rounded-lg border flex items-center gap-2 " + badgeStyle}>
                        <span className="font-mono font-bold">{opt.key}.</span>
                        <span className="truncate">{opt.text}</span>
                      </div>
                    );
                  })}
                </div>

                <div className="bg-white/80 rounded-lg p-3 border border-[#E4E1D8]/60 text-xs">
                  <span className="font-bold text-[var(--ink)] block mb-1">💡 Cách giải chi tiết:</span>
                  <MathText text={q.explanation} className="text-[var(--ink-soft)] leading-relaxed" />
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [examList, setExamList] = useState(() => {
    const saved = localStorage.getItem("saved_exams");
    if(saved) {
      try { return JSON.parse(saved); } catch(e){}
    }
    return [{
      id: "exam-base-1",
      title: "Bộ đề Toán Cực Trị & Hàm Số Mẫu",
      createdAt: new Date().toLocaleDateString("vi-VN"),
      standard: "Kỳ thi tốt nghiệp THPT Quốc gia",
      durationMinutes: 45,
      groups: BASE_GROUPS
    }];
  });

  const [currentExam, setCurrentExam] = useState(null);
  const [activeGroups, setActiveGroups] = useState([]);
  const [answers, setAnswers] = useState({});
  const [screen, setScreen] = useState("home");
  const [secondsLeft, setSecondsLeft] = useState(45 * 60);
  const [result, setResult] = useState(null);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("user_gemini_key") || "");
  
  const [genInitialSource, setGenInitialSource] = useState("");
  const [genInitialTitle, setGenInitialTitle] = useState("");
  const [genInitialStandard, setGenInitialStandard] = useState("Kỳ thi tốt nghiệp THPT Quốc gia");
  const [genInitialDuration, setGenInitialDuration] = useState(45);

  useEffect(() => {
    localStorage.setItem("saved_exams", JSON.stringify(examList));
  }, [examList]);

  useEffect(() => {
    if(screen !== "exam") return;
    if(secondsLeft <= 0){ handleSubmit(); return; }
    const t = setTimeout(()=>setSecondsLeft(s=>s-1), 1000);
    return () => clearTimeout(t);
  }, [secondsLeft, screen]);

  function handleSelectExam(exam){
    setCurrentExam(exam);
    setActiveGroups(buildAttempt(exam.groups));
    setAnswers({});
    setResult(null);
    setSecondsLeft((exam.durationMinutes || 45) * 60);
    setScreen("exam");
  }

  function handleGeneratedNewExam(title, questions, standard, durationMinutes){
    const newExam = {
      id: "exam-" + Date.now(),
      title: title,
      createdAt: new Date().toLocaleDateString("vi-VN"),
      standard: standard,
      durationMinutes: durationMinutes || 45,
      groups: [{ id: "g-ai-" + Date.now(), name: "Nhóm câu hỏi AI", questions }]
    };

    setExamList(prevList => {
      const updated = [newExam, ...prevList];
      if (updated.length > MAX_SAVED_EXAMS) {
        return updated.slice(0, MAX_SAVED_EXAMS);
      }
      return updated;
    });

    setScreen("home");
  }

  function handleRetryMistakes(wrongQuestions){
    const sourceSummary = wrongQuestions.map((q, idx) => 'Câu ' + (idx+1) + ': ' + q.content).join("\n");
    setGenInitialSource(sourceSummary);
    setGenInitialTitle('Đề luyện lại các câu sai (' + wrongQuestions.length + ' câu)');
    setGenInitialStandard(currentExam?.standard || "Kỳ thi tốt nghiệp THPT Quốc gia");
    setGenInitialDuration(currentExam?.durationMinutes || 45);
    setScreen("generator");
  }

  function handleSelectOption(qid, key){
    setAnswers(prev => ({ ...prev, [qid]: key }));
  }

  function handleSubmit(){
    const allQuestions = activeGroups.flatMap(g=>g.questions);
    const correctCount = allQuestions.filter(q => answers[q.id] === q.correctKey).length;
    const total = allQuestions.length;
    const score = total ? (correctCount/total)*10 : 0;
    
    setResult({ score, correctCount, total });
    setScreen("result");
  }

  return (
    <div style={{ background:"var(--paper)" }}>
      {screen === "home" && (
        <HomeScreen examList={examList} onSelectExam={handleSelectExam} onOpenGenerator={()=>{
          setGenInitialSource(""); setGenInitialTitle(""); setGenInitialDuration(45); setScreen("generator");
        }} />
      )}
      {screen === "generator" && (
        <GeneratorScreen 
          onBack={()=>setScreen("home")} 
          onGenerated={handleGeneratedNewExam} 
          apiKey={apiKey} 
          setApiKey={setApiKey} 
          initialSourceText={genInitialSource}
          initialTitle={genInitialTitle}
          initialStandard={genInitialStandard}
          initialDuration={genInitialDuration}
        />
      )}
      {screen === "exam" && currentExam && (
        <ExamScreen examTitle={currentExam.title} groups={activeGroups} answers={answers} onSelect={handleSelectOption} secondsLeft={secondsLeft} onSubmit={handleSubmit} />
      )}
      {screen === "result" && currentExam && (
        <ResultScreen examTitle={currentExam.title} groups={activeGroups} answers={answers} result={result} onGoHome={()=>setScreen("home")} onRetryMistakes={handleRetryMistakes} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
