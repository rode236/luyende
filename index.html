<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Soạn & Luyện Thi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS & JS hỗ trợ hiển thị công thức Toán chuẩn -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- FORM SOẠN ĐỀ -->
        <div id="setupSection" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Soạn đề thi phân hóa bằng Gemini AI</h2>
            <p class="text-slate-500 text-sm mb-6">Hệ thống sẽ tự động phân tích và tạo bộ câu hỏi có ma trận độ khó chuẩn cấu trúc kỳ thi.</p>

            <div id="errorAlert" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm"></div>

            <form id="aiForm" class="space-y-4" onsubmit="return false;">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">1. Tên bài thi tổng hợp</label>
                    <input type="text" id="examTitle" value="Đề Luyện Thi Đa Dạng AI — 2026" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">2. Chọn kỳ thi định hướng</label>
                        <select id="examType" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="THPT Quốc Gia">THPT Quốc Gia</option>
                            <option value="ĐGTD — Bách Khoa Hà Nội">ĐGTD — Bách Khoa Hà Nội</option>
                            <option value="ĐGNL — ĐHQG Hà Nội">ĐGNL — ĐHQG Hà Nội</option>
                            <option value="ĐGNL — ĐHQG TP.HCM">ĐGNL — ĐHQG TP.HCM</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">3. Mức độ phân hóa</label>
                        <select id="examLevel" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="Phân hóa chuẩn (Tăng dần từ Dễ đến Khó)">Chuẩn (Dễ → Khó)</option>
                            <option value="Cơ bản (Nhận biết - Thông hiểu)">Cơ bản (Nhận biết - Thông hiểu)</option>
                            <option value="Nâng cao (Vận dụng - Vận dụng cao)">Nâng cao (Vận dụng cao)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">4. Số lượng câu hỏi</label>
                        <input type="number" id="questionCount" value="10" min="1" max="50" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">5. Thời gian làm bài (Phút)</label>
                        <input type="number" id="examDuration" value="15" min="1" max="180" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">6. Gemini API Key</label>
                        <input type="password" id="apiKey" placeholder="Dán API Key tại đây..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <!-- PHẦN DANH SÁCH CÁC CHỦ ĐỀ / DẠNG BÀI (CÓ NÚT + THÊM CHỦ ĐỀ) -->
                <div class="pt-2 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-bold uppercase text-slate-600">7. Nội dung & Các Chủ Đề Lọc Đề Trộn</label>
                        <button type="button" onclick="addTopicField()" class="flex items-center gap-1 text-xs px-3 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold rounded-lg transition-all border border-amber-200">
                            <span>+</span> Thêm Chủ Đề / Dạng Bài
                        </button>
                    </div>
                    
                    <div id="topicsContainer" class="space-y-3">
                        <!-- Khung chủ đề mặc định 1 -->
                        <div class="topic-item p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 relative">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-500 uppercase">Chủ đề / Dạng bài #1</span>
                            </div>
                            <textarea rows="2" placeholder="Nhập kiến thức, ghi chú hoặc nội dung bài học cho chủ đề này..." class="topic-content w-full p-2.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                        </div>
                    </div>
                </div>

                <button type="button" onclick="generateExam()" id="btnSubmit" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition-all">
                    ✨ Tạo Đề Trộn Chuẩn Cấu Trúc Ngay
                </button>
            </form>
        </div>

        <!-- SẢNH THI -->
        <div id="lobbySection" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 text-center">Sảnh Thi Trực Tuyến</h1>
            <p class="text-slate-500 text-sm text-center mb-6">Chọn bộ đề để bắt đầu luyện tập</p>
            <div id="examList" class="space-y-4"></div>
        </div>

        <!-- MAN HINH LAM BAI THI -->
        <div id="quizSection" class="hidden bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <h2 id="quizTitle" class="text-xl font-bold text-slate-800"></h2>
                    <p id="quizMeta" class="text-xs text-slate-500"></p>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Thời gian còn lại</span>
                    <span id="timer" class="text-xl font-mono font-bold text-amber-600">00:00</span>
                </div>
            </div>

            <!-- BẢNG KẾT QUẢ HIỂN THỊ SAU KHINỘP BÀI -->
            <div id="resultSummary" class="hidden p-5 bg-slate-100 rounded-2xl border border-slate-200 text-center space-y-3">
                <h3 class="text-lg font-bold text-slate-800">🎉 Kết Quả Bài Thi</h3>
                <p id="scoreText" class="text-2xl font-extrabold text-emerald-600"></p>
                <div class="flex justify-center gap-3 pt-2">
                    <button id="btnRetryWrong" onclick="retryWrongQuestions()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl transition-all shadow-sm">
                        🔄 Luyện lại câu sai
                    </button>
                    <button onclick="exitQuiz()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-xl transition-all shadow-sm">
                        ➡️ Làm bài thi tiếp theo
                    </button>
                </div>
            </div>

            <div id="quizQuestions" class="space-y-6"></div>

            <div class="flex justify-between items-center pt-4 border-t">
                <button onclick="exitQuiz()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm">
                    ← Thoát
                </button>
                <button id="btnSubmitQuiz" onclick="submitQuiz()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition-all">
                    Đã Nộp Bài
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentTimer = null;
        let activeExam = null;
        let wrongQuestions = [];
        let topicCounter = 1;

        // Hàm thêm khung nhập chủ đề mới khi bấm nút +
        function addTopicField() {
            topicCounter++;
            const container = document.getElementById('topicsContainer');
            const newField = document.createElement('div');
            newField.className = 'topic-item p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 relative';
            newField.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase">Chủ đề / Dạng bài #${topicCounter}</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-xs text-red-500 hover:text-red-700 font-bold">✕ Xóa</button>
                </div>
                <textarea rows="2" placeholder="Nhập kiến thức, ghi chú hoặc nội dung bài học cho chủ đề này..." class="topic-content w-full p-2.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
            `;
            container.appendChild(newField);
        }

        // Render Toán Học KaTeX
        function renderMath() {
            setTimeout(() => {
                if (window.renderMathInElement) {
                    renderMathInElement(document.body, {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "\\(", right: "\\)", display: false},
                            {left: "\\[", right: "\\]", display: true},
                            {left: "$", right: "$", display: false}
                        ],
                        throwOnError: false
                    });
                }
            }, 50);
        }

        // Render danh sách đề thi từ LocalStorage
        function renderExams() {
            const listContainer = document.getElementById('examList');
            let storedExams = [];
            
            try {
                storedExams = JSON.parse(localStorage.getItem('exams')) || [];
            } catch(e) {
                storedExams = [];
            }
            
            if (storedExams.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-400 py-4 text-sm">Chưa có đề thi nào. Hãy dùng bảng bên trên để tạo đề bằng AI!</p>`;
                return;
            }

            listContainer.innerHTML = storedExams.map((exam, index) => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-200 hover:border-amber-300 transition-all">
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
                            <span class="px-2 py-0.5 bg-slate-200 rounded text-slate-700 font-bold">Đề #${index + 1}</span>
                            <span>⏱ ${exam.duration || 15} phút</span>
                            <span>• ${exam.type || 'Tổng hợp'}</span>
                        </div>
                        <h3 class="font-bold text-slate-800">${exam.title} (${exam.questions ? exam.questions.length : 0} câu)</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="startQuiz(${exam.id})" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl transition-all">
                            Vào thi →
                        </button>
                        <button onclick="deleteExam(${exam.id})" class="p-2 text-red-500 hover:bg-red-50 rounded-lg text-xs">
                            Xóa
                        </button>
                    </div>
                </div>
            `).join('');
            
            renderMath();
        }

        // Tạo đề bằng Gemini API
        async function generateExam() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const title = document.getElementById('examTitle').value.trim();
            const type = document.getElementById('examType').value;
            const level = document.getElementById('examLevel').value;
            const qCount = parseInt(document.getElementById('questionCount').value) || 10;
            const duration = parseInt(document.getElementById('examDuration').value) || 15;
            
            // Lấy tất cả nội dung chủ đề được nhập
            const topicElements = document.querySelectorAll('.topic-content');
            let topicsList = [];
            topicElements.forEach((el, i) => {
                const val = el.value.trim();
                if (val) topicsList.push(`- Chủ đề ${i+1}: ${val}`);
            });

            const rawContent = topicsList.length > 0 
                ? topicsList.join('\n') 
                : "Tự động kết hợp kiến thức tổng hợp đa dạng các dạng toán/tư duy.";

            const errorAlert = document.getElementById('errorAlert');
            const btnSubmit = document.getElementById('btnSubmit');

            errorAlert.classList.add('hidden');

            if (!apiKey) {
                errorAlert.innerText = "Vui lòng nhập Gemini API Key!";
                errorAlert.classList.remove('hidden');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ AI đang lọc & trộn đề đa dạng...";

            const prompt = `Bạn là chuyên gia ra đề thi cấp quốc gia. Hãy biên soạn một bộ đề thi trắc nghiệm gồm đúng ${qCount} câu hỏi chuẩn hóa:
- Tên đề: ${title}
- Định hướng kỳ thi: ${type}
- Tiêu chuẩn phân hóa: Sắp xếp danh sách câu hỏi theo thứ tự ĐỘ KHÓ TĂNG DẦN (từ Nhận biết -> Thông hiểu -> Vận dụng -> Vận dụng cao).
- Danh sách các chủ đề/tài liệu được cung cấp:
${rawContent}

YÊU CẦU LỌC & TRỘN ĐỀ:
1. Hãy phân bổ đều số câu hỏi qua tất cả các Chủ đề/Dạng bài được cung cấp ở trên để tạo sự bất ngờ và phong phú.
2. Tất cả công thức, biến số toán học BẮT BUỘC phải bọc trong ký hiệu LaTeX chuẩn: \\( ... \\) cho inline hoặc $$ ... $$ cho display.

Yêu cầu xuất dữ liệu: Trả về DUY NHẤT 1 chuỗi JSON hợp lệ (không kèm markdown, không thêm bất kỳ văn bản giải thích nào) theo cấu trúc:
{
  "questions": [
    {
      "id": 1,
      "question": "Nội dung câu hỏi chứa LaTeX...",
      "options": ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
      "answer": 0,
      "explanation": "Lời giải chi tiết chứa LaTeX..."
    }
  ]
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            response_mime_type: "application/json"
                        }
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Lỗi khi gọi API Gemini.");
                }

                let responseText = data.candidates[0].content.parts[0].text;
                responseText = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                const examParsed = JSON.parse(responseText);

                if (!examParsed.questions || !Array.isArray(examParsed.questions)) {
                    throw new Error("Cấu trúc dữ liệu AI trả về không hợp lệ.");
                }

                const storedExams = JSON.parse(localStorage.getItem('exams')) || [];
                const newExam = {
                    id: Date.now(),
                    title: title,
                    type: type,
                    duration: duration,
                    questions: examParsed.questions
                };

                storedExams.unshift(newExam);
                localStorage.setItem('exams', JSON.stringify(storedExams));

                renderExams();
                alert(`Đã tạo thành công bộ đề đa dạng với ${newExam.questions.length} câu hỏi!`);

            } catch (err) {
                errorAlert.innerText = `Không thể tạo đề: ${err.message}`;
                errorAlert.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "✨ Tạo Đề Trộn Chuẩn Cấu Trúc Ngay";
            }
        }

        // Bắt đầu làm bài thi
        function startQuiz(examIdOrObject) {
            if (typeof examIdOrObject === 'object') {
                activeExam = examIdOrObject;
            } else {
                const storedExams = JSON.parse(localStorage.getItem('exams')) || [];
                activeExam = storedExams.find(e => e.id === examIdOrObject);
            }

            if (!activeExam || !activeExam.questions || activeExam.questions.length === 0) {
                return alert("Bộ đề không hợp lệ hoặc không có câu hỏi!");
            }

            // Reset giao diện
            document.getElementById('resultSummary').classList.add('hidden');
            document.getElementById('btnSubmitQuiz').disabled = false;
            document.getElementById('btnSubmitQuiz').classList.remove('hidden');

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('lobbySection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');

            document.getElementById('quizTitle').innerText = activeExam.title;
            document.getElementById('quizMeta').innerText = `${activeExam.type} • ${activeExam.questions.length} câu`;

            // Render câu hỏi
            const questionsContainer = document.getElementById('quizQuestions');
            questionsContainer.innerHTML = activeExam.questions.map((q, idx) => `
                <div class="p-5 bg-slate-50 border border-slate-200 rounded-xl space-y-3" id="q_box_${q.id}">
                    <p class="font-bold text-slate-800 text-base">Câu ${idx + 1}: ${q.question}</p>
                    <div class="space-y-2">
                        ${q.options.map((opt, oIdx) => `
                            <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-amber-50 transition-all">
                                <input type="radio" name="q_${q.id}" value="${oIdx}" class="w-4 h-4 text-amber-600 focus:ring-amber-500">
                                <span class="text-sm text-slate-700">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="explain_${q.id}" class="hidden p-4 bg-blue-50 border border-blue-200 text-blue-900 text-xs md:text-sm rounded-xl mt-3 leading-relaxed">
                        <strong>Lời giải chi tiết:</strong> ${q.explanation || 'Không có hướng dẫn giải.'}
                    </div>
                </div>
            `).join('');

            renderMath();
            startTimer(activeExam.duration * 60);
        }

        // Đồng hồ đếm ngược
        function startTimer(seconds) {
            clearInterval(currentTimer);
            let timeLeft = seconds;
            const timerDisplay = document.getElementById('timer');
            
            currentTimer = setInterval(() => {
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${m}:${s}`;

                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    alert("Đã hết thời gian làm bài!");
                    submitQuiz();
                }
                timeLeft--;
            }, 1000);
        }

        // Nộp bài thi & Chấm điểm
        function submitQuiz() {
            clearInterval(currentTimer);
            let score = 0;
            const total = activeExam.questions.length;
            wrongQuestions = [];

            activeExam.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                const explainBox = document.getElementById(`explain_${q.id}`);
                
                if (explainBox) explainBox.classList.remove('hidden');

                if (selected && parseInt(selected.value) === q.answer) {
                    score++;
                } else {
                    wrongQuestions.push(q);
                }
            });

            // Hiển thị bảng tổng kết kết quả
            const scoreText = document.getElementById('scoreText');
            scoreText.innerText = `Đúng ${score} / ${total} câu (${Math.round((score/total)*100)}%)`;
            
            const btnRetry = document.getElementById('btnRetryWrong');
            if (wrongQuestions.length === 0) {
                btnRetry.classList.add('hidden');
            } else {
                btnRetry.classList.remove('hidden');
            }

            document.getElementById('resultSummary').classList.remove('hidden');
            document.getElementById('btnSubmitQuiz').classList.add('hidden');
            
            renderMath();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Tạo bài thi luyện lại các câu sai
        function retryWrongQuestions() {
            if (wrongQuestions.length === 0) return;
            
            const wrongExam = {
                id: Date.now(),
                title: `[Luyện lại câu sai] ${activeExam.title}`,
                type: activeExam.type,
                duration: Math.max(5, Math.ceil(wrongQuestions.length * 1.5)),
                questions: wrongQuestions
            };

            startQuiz(wrongExam);
        }

        // Thoát giao diện làm bài
        function exitQuiz() {
            clearInterval(currentTimer);
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('setupSection').classList.remove('hidden');
            document.getElementById('lobbySection').classList.remove('hidden');
            renderExams();
        }

        // Xóa đề thi
        function deleteExam(examId) {
            if (!confirm("Bạn có chắc muốn xóa đề thi này?")) return;
            let storedExams = JSON.parse(localStorage.getItem('exams')) || [];
            storedExams = storedExams.filter(e => e.id !== examId);
            localStorage.setItem('exams', JSON.stringify(storedExams));
            renderExams();
        }

        // Tải danh sách lần đầu
        document.addEventListener('DOMContentLoaded', renderExams);
    </script>
</body>
</html>
