<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LuyệnThi.AI — Phòng thi trực tuyến Gemini AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/React/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --paper:#FAF9F5;
    --ink:#14213D;
    --ink-soft:#4B5675;
    --line:#E4E1D8;
    --accent:#FCA311;
    --accent-deep:#B9720A;
    --success:#1E8F80;
    --success-bg:#E7F5F1;
    --danger:#D8434B;
    --danger-bg:#FBEAEA;
  }
  html,body{ background:var(--paper); font-family:'Inter',sans-serif; color:var(--ink); }
  .font-display{ font-family:'Sora',sans-serif; }
  .font-mono-num{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D8D3C4; border-radius:99px; }
  .bubble{
    width:30px; height:30px; border-radius:9999px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:13px; color:var(--ink-soft); flex-shrink:0; transition:all .15s ease;
  }
  .option-btn{ transition:all .15s ease; }
  .option-btn:hover .bubble{ border-color:var(--accent); }
  .option-btn.selected .bubble{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .option-btn.selected{ background:#F1EEE5; border-color:var(--ink) !important; }
  .katex{ font-size:1.02em; }
  .spinner{ border:3px solid #E4E1D8; border-top-color:var(--accent); border-radius:50%; width:28px; height:28px; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useMemo, createElement: h } = React;

const MAX_SAVED_EXAMS = 30;

function cleanAndParseJSON(rawText) {
  let clean = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
  clean = clean.replace(/[\u0000-\u001F\u007F-\u009F]/g, " ");
  clean = clean.replace(/\\(?!["\\/bfnrtu])/g, "\\\\");

  try {
    return JSON.parse(clean);
  } catch (err) {
    const start = clean.indexOf("[");
    const end = clean.lastIndexOf("]");
    if (start !== -1 && end !== -1 && end > start) {
      return JSON.parse(clean.substring(start, end + 1));
    }
    throw err;
  }
}

async function requestGemini(modelName, promptText, apiKey) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey.trim();
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { responseMimeType: "application/json" }
    })
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    const message = errData.error?.message || ('Lỗi kết nối Gemini API (' + res.status + ')');
    const error = new Error(message);
    error.status = res.status;
    throw error;
  }

  const data = await res.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  return cleanAndParseJSON(rawText);
}

async function callGemini(promptText, userApiKey) {
  const apiKey = userApiKey || localStorage.getItem("user_gemini_key");
  if (!apiKey || !apiKey.trim()) throw new Error("Vui lòng nhập Gemini API Key!");

  try {
    return await requestGemini("gemini-1.5-flash", promptText, apiKey);
  } catch (err) {
    if (err.status === 429 || err.status === 503 || (err.message && err.message.includes("high demand"))) {
      return await requestGemini("gemini-1.5-pro", promptText, apiKey);
    }
    throw err;
  }
}

const BASE_GROUPS = [
  {
    id: "g1",
    name: "Nhóm 1 · Hàm số & Tư duy",
    questions: [
      { id:"g1q1", content:"Cho hàm số $y = -x^3 + 3x^2 + 2$. Số điểm cực trị của hàm số là:", options:["0","1","2","3"], correctIndex:2, explanation:"Đạo hàm $y' = -3x^2+6x = -3x(x-2)$ có hai nghiệm phân biệt $x=0$ và $x=2$, đổi dấu 2 lần nên có 2 cực trị." },
      { id:"g1q2", content:"Cho hàm số $y = x^4 - 2x^2 + 1$. Hàm số nghịch biến trên khoảng nào?", options:["$(-\\infty;-1)$","$(-1;0)$","$(0;1)$","$(1;+\\infty)$"], correctIndex:0, explanation:"$y' = 4x(x-1)(x+1) < 0$ trên $(-\\infty;-1)$ nên hàm số nghịch biến." },
      { id:"g1q3", content:"Giá trị lớn nhất của hàm số $y = -x^2+4x-1$ trên $\\mathbb{R}$ là:", options:["3","-3","1","5"], correctIndex:0, explanation:"Đỉnh parabol $y_{max}=3$ tại $x=2$." }
    ]
  }
];

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const LETTERS = ["A","B","C","D"];

function buildAttempt(groups, opts){
  const shuffleQuestionOrder = !opts || opts.shuffleQuestionOrder !== false;
  let n = 0;
  return groups.map(g => ({
    id: g.id,
    name: g.name,
    questions: (shuffleQuestionOrder ? shuffleArray(g.questions) : g.questions).map(q => {
      n++;
      const shuffledOpts = shuffleArray(q.options.map((text,idx)=>({text, isCorrect: idx===q.correctIndex})));
      const options = shuffledOpts.map((o,i)=>({ key: LETTERS[i], text:o.text, isCorrect:o.isCorrect }));
      return { id:q.id, num:n, content:q.content, explanation:q.explanation, options, correctKey: options.find(o=>o.isCorrect).key, difficulty:q.difficulty };
    })
  }));
}

function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderLatexMix(text){
  if(!text) return "";
  const parts = String(text).split(/(\$\$[^$]+\$\$|\$[^$]+\$)/g);
  return parts.map(part => {
    if(part.length>3 && part.startsWith("$$") && part.endsWith("$$")){
      try{ return window.katex.renderToString(part.slice(2,-2), {throwOnError:false, displayMode:true}); }
      catch(e){ return escapeHtml(part); }
    }
    if(part.length>1 && part.startsWith("$") && part.endsWith("$")){
      try{ return window.katex.renderToString(part.slice(1,-1), {throwOnError:false}); }
      catch(e){ return escapeHtml(part); }
    }
    return escapeHtml(part).replace(/\n/g,"<br/>");
  }).join("");
}
function MathText({ text, className }){
  const html = useMemo(()=>renderLatexMix(text), [text]);
  return h("span", { className: className, dangerouslySetInnerHTML: { __html: html } });
}
function formatClock(totalSeconds){
  const s = Math.max(0, totalSeconds);
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

const DIFFICULTY_BANDS = [
  { from:1, to:4, count:4, levelName:"Nhận biết - Thông hiểu", guidance:"Rất rõ ràng, kiểm tra trực tiếp kiến thức cốt lõi." },
  { from:5, to:8, count:4, levelName:"Vận dụng thấp", guidance:"Độ khó trung bình, cần 2-3 bước tư duy logic." },
  { from:9, to:11, count:3, levelName:"Vận dụng cao", guidance:"Phân hóa khá, đòi hỏi sự linh hoạt và tính toán cẩn thận." },
  { from:12, to:12, count:1, levelName:"Phân hóa xuất sắc", guidance:"Câu hỏi chốt chặn năng lực sâu sắc." }
];

async function generateQuestionBank(sourceText, standard, apiKey, onProgress){
  let all = [];
  for(const band of DIFFICULTY_BANDS){
    if(onProgress) onProgress(band);
    const prompt = 'Bạn là chuyên gia khảo thí uy tín. Định hướng: "' + standard + '". Dựa vào kiến thức: "' + sourceText + '". Hãy tạo đúng ' + band.count + ' câu hỏi trắc nghiệm bám sát mức độ "' + band.levelName + '". Trả về MẢNG JSON gồm ' + band.count + ' phần tử: [{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]';

    const parsed = await callGemini(prompt, apiKey);
    const qs = parsed.map((item, i) => ({
      id: "q-" + Date.now() + "-" + band.from + "-" + i,
      content: item.question,
      options: item.options,
      correctIndex: item.correctIndex,
      explanation: item.explanation || "Không có giải thích chi tiết.",
      difficulty: band.from + i
    }));
    all = all.concat(qs);
  }
  return all;
}

function HomeScreen({ examList, onSelectExam, onOpenGenerator }){
  return h("div", { className: "min-h-screen p-4 sm:p-8" },
    h("div", { className: "max-w-4xl mx-auto" },
      h("div", { className: "flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8" },
        h("div", null,
          h("h1", { className: "font-display font-extrabold text-2xl sm:text-3xl text-[var(--ink)]" }, "Sảnh Thi Trực Tuyến"),
          h("p", { className: "text-sm text-[#4B5675] mt-1" }, "Kho lưu trữ đề thi chung cho mọi người cùng ôn tập")
        ),
        h("button", { onClick: onOpenGenerator, className: "px-5 py-3 rounded-xl bg-[var(--accent)] text-[var(--ink)] font-semibold hover:bg-[var(--accent-deep)] hover:text-white transition-colors shadow-sm" }, "✨ Tạo đề mới bằng AI")
      ),
      h("div", { className: "bg-white rounded-2xl border border-[#E4E1D8] p-6" },
        h("div", { className: "flex items-center justify-between mb-4" },
          h("h2", { className: "font-display font-bold text-lg text-[var(--ink)]" }, "Danh sách đề thi (" + examList.length + "/" + MAX_SAVED_EXAMS + ")"),
          h("span", { className: "text-xs text-[#9AA5B1]" }, "Tự động dọn dẹp đề cũ khi đầy")
        ),
        h("div", { className: "grid gap-3" },
          examList.map((item, idx) => h("div", { key: item.id, className: "flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl border border-[#E4E1D8] bg-[#FAF9F5] gap-3" },
            h("div", null,
              h("div", { className: "flex items-center gap-2 mb-1" },
                h("span", { className: "text-xs font-mono-num font-bold px-2 py-0.5 rounded bg-[#E4E1D8]" }, "Đề #" + (examList.length - idx)),
                h("span", { className: "text-xs text-[#9AA5B1]" }, item.createdAt),
                h("span", { className: "text-xs text-[var(--ink-soft)] font-medium" }, "⏱️ " + (item.durationMinutes || 45) + " phút")
              ),
              h("h3", { className: "font-semibold text-base text-[var(--ink)]" }, item.title)
            ),
            h("button", { onClick: () => onSelectExam(item), className: "w-full sm:w-auto px-4 py-2 rounded-lg bg-[var(--ink)] text-white text-sm font-semibold" }, "Vào thi →")
          ))
        )
      )
    )
  );
}

function GeneratorScreen({ onBack, onGenerated, apiKey, setApiKey, initialSourceText, initialTitle, initialStandard, initialDuration }){
  const [sourceText, setSourceText] = useState(initialSourceText || "");
  const [examTitle, setExamTitle] = useState(initialTitle || "");
  const [standard, setStandard] = useState(initialStandard || "Kỳ thi tốt nghiệp THPT Quốc gia");
  const [durationMinutes, setDurationMinutes] = useState(initialDuration || 45);
  const [loading, setLoading] = useState(false);
  const [progressLabel, setProgressLabel] = useState("");
  const [error, setError] = useState("");

  async function handleGenerate(){
    if(!apiKey || !apiKey.trim()){ setError("Vui lòng nhập Gemini API Key!"); return; }
    if(!sourceText.trim()){ setError("Vui lòng nhập nội dung!"); return; }
    setError(""); setLoading(true);
    localStorage.setItem("user_gemini_key", apiKey.trim());

    try{
      const questions = await generateQuestionBank(sourceText.trim(), standard, apiKey.trim(), band => {
        setProgressLabel("Gemini đang tạo câu " + band.from + "/12...");
      });
      const title = examTitle.trim() || ("Đề ôn tập - " + sourceText.trim().slice(0, 20) + "...");
      onGenerated(title, questions, standard, Number(durationMinutes));
    }catch(e){
      setError("Lỗi: " + e.message);
    }
    setLoading(false); setProgressLabel("");
  }

  return h("div", { className: "min-h-screen p-4 sm:p-8 max-w-3xl mx-auto" },
    h("button", { onClick: onBack, className: "text-sm text-[#4B5675] mb-4" }, "← Quay lại Sảnh chính"),
    h("div", { className: "bg-white rounded-2xl border border-[#E4E1D8] p-6 space-y-4" },
      h("h2", { className: "font-display font-bold text-xl" }, "Tạo bộ đề 12 câu bằng AI"),
      h("div", null,
        h("label", { className: "text-sm font-semibold block mb-1" }, "1. Chuẩn độ khung định hướng"),
        h("select", { value: standard, onChange: e=>setStandard(e.target.value), className: "w-full text-sm p-2.5 rounded-xl border border-[#E4E1D8]" },
          h("option", { value: "Kỳ thi tốt nghiệp THPT Quốc gia" }, "Chuẩn THPT Quốc gia"),
          h("option", { value: "Đánh giá năng lực ĐHQG TP.HCM" }, "Đánh giá năng lực ĐHQG TP.HCM"),
          h("option", { value: "Đánh giá năng lực ĐHQG Hà Nội" }, "Đánh giá năng lực ĐHQG Hà Nội")
        )
      ),
      h("div", { className: "grid grid-cols-1 sm:grid-cols-3 gap-4" },
        h("div", { className: "sm:col-span-2" },
          h("label", { className: "text-sm font-semibold block mb-1" }, "2. Tên đề thi"),
          h("input", { type: "text", value: examTitle, onChange: e=>setExamTitle(e.target.value), className: "w-full text-sm p-2.5 rounded-xl border border-[#E4E1D8]" })
        ),
        h("div", null,
          h("label", { className: "text-sm font-semibold block mb-1" }, "⏱️ Thời gian (Phút)"),
          h("input", { type: "number", value: durationMinutes, onChange: e=>setDurationMinutes(e.target.value), className: "w-full text-sm p-2.5 rounded-xl border border-[#E4E1D8]" })
        )
      ),
      h("div", null,
        h("label", { className: "text-sm font-semibold block mb-1" }, "3. Gemini API Key"),
        h("input", { type: "password", value: apiKey, onChange: e=>setApiKey(e.target.value), placeholder: "Dán AIzaSy...", className: "w-full text-sm p-2.5 rounded-xl border border-[#E4E1D8]" })
      ),
      h("div", null,
        h("label", { className: "text-sm font-semibold block mb-1" }, "4. Nội dung / Câu hỏi gốc"),
        h("textarea", { value: sourceText, onChange: e=>setSourceText(e.target.value), rows: 5, className: "w-full text-sm p-2.5 rounded-xl border border-[#E4E1D8]" })
      ),
      error && h("p", { className: "text-sm text-[var(--danger)] font-semibold" }, error),
      h("button", { onClick: handleGenerate, disabled: loading, className: "w-full py-3.5 rounded-xl bg-[var(--accent)] font-semibold" },
        loading ? progressLabel : "✨ Tạo đề và Lưu vào Sảnh"
      )
    )
  );
}

function ExamScreen({ examTitle, groups, answers, onSelect, secondsLeft, onSubmit }){
  return h("div", { className: "min-h-screen pb-12" },
    h("header", { className: "border-b border-[#E4E1D8] bg-white sticky top-0 z-30 p-4" },
      h("div", { className: "max-w-[1400px] mx-auto flex items-center justify-between" },
        h("h1", { className: "font-display font-bold text-lg" }, examTitle),
        h("div", { className: "font-mono-num text-2xl font-bold" }, formatClock(secondsLeft))
      )
    ),
    h("div", { className: "max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-6 p-4" },
      h("main", null,
        groups.map(g => h("div", { key: g.id },
          g.questions.map(q => h("div", { key: q.id },
            h("div", { className: "bg-white rounded-2xl border border-[#E4E1D8] p-5 mb-4" },
              h("div", { className: "text-xs font-bold text-[#9AA5B1] mb-2" }, "Câu " + q.num),
              h(MathText, { text: q.content, className: "text-base font-medium block mb-4" }),
              h("div", { className: "grid sm:grid-cols-2 gap-2.5" },
                q.options.map(opt => h("button", {
                  key: opt.key,
                  onClick: () => onSelect(q.id, opt.key),
                  className: "option-btn flex items-center gap-3 text-left p-3 rounded-xl border " + (answers[q.id]===opt.key ? "selected" : "bg-white")
                },
                  h("span", { className: "bubble" }, opt.key),
                  h(MathText, { text: opt.text, className: "text-sm" })
                ))
              )
            )
          ))
        ))
      ),
      h("aside", null,
        h("button", { onClick: onSubmit, className: "w-full py-3.5 rounded-xl bg-[var(--ink)] text-white font-semibold" }, "Nộp bài và xem giải")
      )
    )
  );
}

function ResultScreen({ examTitle, groups, answers, result, onGoHome }){
  const allQuestions = groups.flatMap(g=>g.questions);
  return h("div", { className: "min-h-screen p-4 max-w-4xl mx-auto" },
    h("div", { className: "bg-white rounded-2xl border border-[#E4E1D8] p-6 text-center" },
      h("h1", { className: "font-bold text-xl mb-2" }, examTitle),
      h("div", { className: "text-5xl font-extrabold mb-4" }, result.score.toFixed(2), h("span", { className: "text-xl font-normal" }, " / 10đ")),
      h("button", { onClick: onGoHome, className: "px-6 py-3 rounded-xl bg-[var(--ink)] text-white font-bold" }, "🏠 Quay lại Sảnh chính")
    )
  );
}

function App(){
  const [examList, setExamList] = useState(() => {
    const saved = localStorage.getItem("saved_exams");
    return saved ? JSON.parse(saved) : [{ id: "exam-base-1", title: "Bộ đề Toán Cực Trị Mẫu", createdAt: "Mới", durationMinutes: 45, groups: BASE_GROUPS }];
  });
  const [currentExam, setCurrentExam] = useState(null);
  const [activeGroups, setActiveGroups] = useState([]);
  const [answers, setAnswers] = useState({});
  const [screen, setScreen] = useState("home");
  const [secondsLeft, setSecondsLeft] = useState(45 * 60);
  const [result, setResult] = useState(null);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("user_gemini_key") || "");

  useEffect(() => { localStorage.setItem("saved_exams", JSON.stringify(examList)); }, [examList]);

  useEffect(() => {
    if(screen !== "exam") return;
    if(secondsLeft <= 0){ handleSubmit(); return; }
    const t = setTimeout(()=>setSecondsLeft(s=>s-1), 1000);
    return () => clearTimeout(t);
  }, [secondsLeft, screen]);

  function handleSelectExam(exam){
    setCurrentExam(exam);
    setActiveGroups(buildAttempt(exam.groups));
    setAnswers({});
    setSecondsLeft((exam.durationMinutes || 45) * 60);
    setScreen("exam");
  }

  function handleGeneratedNewExam(title, questions, standard, durationMinutes){
    const newExam = { id: "exam-" + Date.now(), title, createdAt: "Vừa xong", standard, durationMinutes: durationMinutes || 45, groups: [{ id: "g-ai", name: "AI", questions }] };
    setExamList(prev => [newExam, ...prev]);
    setScreen("home");
  }

  function handleSubmit(){
    const allQuestions = activeGroups.flatMap(g=>g.questions);
    const correctCount = allQuestions.filter(q => answers[q.id] === q.correctKey).length;
    setResult({ score: (correctCount/allQuestions.length)*10, correctCount, total: allQuestions.length });
    setScreen("result");
  }

  if (screen === "home") return h(HomeScreen, { examList, onSelectExam: handleSelectExam, onOpenGenerator: () => setScreen("generator") });
  if (screen === "generator") return h(GeneratorScreen, { onBack: () => setScreen("home"), onGenerated: handleGeneratedNewExam, apiKey, setApiKey });
  if (screen === "exam") return h(ExamScreen, { examTitle: currentExam.title, groups: activeGroups, answers, onSelect: (qid, k)=>setAnswers(p=>({...p, [qid]:k})), secondsLeft, onSubmit: handleSubmit });
  if (screen === "result") return h(ResultScreen, { examTitle: currentExam.title, groups: activeGroups, answers, result, onGoHome: () => setScreen("home") });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
